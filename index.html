<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Artifacts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 48px 24px;
    }

    header {
      max-width: 720px;
      margin: 0 auto 48px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      margin-top: 8px;
      color: #666;
      font-size: 0.9rem;
    }

    .grid {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover {
      border-color: #444;
      background: #1f1f1f;
    }

    .card-left { display: flex; flex-direction: column; gap: 4px; }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: #f0f0f0;
    }

    .card-meta {
      font-size: 0.78rem;
      color: #555;
    }

    .card-arrow {
      color: #444;
      font-size: 1.1rem;
    }

    .empty {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 0;
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      border: 1px dashed #2a2a2a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Artifacts</h1>
    <p>AI-generated HTML files — accessible anywhere.</p>
  </header>

  <div class="grid" id="artifact-list">
    <!-- artifacts are listed here -->
  </div>

  <script>
    const ARTIFACTS = [
      { title: "Dotfiles 完整教學指南", date: "2026-07-22", path: "2026-07-22-dotfiles-guide/index.html" },
      { title: "Television 設定學習文件", date: "2026-06-30", path: "2026-06-30-television-guide/index.html" },
      { title: "Java Learning Tracker", date: "2026-06-09", path: "2026-06-09-java-learning-tracker/index.html" },
      { title: "Tmux Guide", date: "2026-06-08", path: "2026-06-08-tmux-guide/index.html" },
    ];

    const list = document.getElementById("artifact-list");

    if (ARTIFACTS.length === 0) {
      list.outerHTML = `<div class="empty">No artifacts yet. Add your first HTML file and update ARTIFACTS in index.html.</div>`;
    } else {
      ARTIFACTS.sort((a, b) => b.date.localeCompare(a.date)).forEach(item => {
        list.insertAdjacentHTML("beforeend", `
          <a class="card" href="${item.path}">
            <div class="card-left">
              <span class="card-title">${item.title}</span>
              <span class="card-meta">${item.date}</span>
            </div>
            <span class="card-arrow">→</span>
          </a>
        `);
      });
    }
  </script>
</body>
</html>
