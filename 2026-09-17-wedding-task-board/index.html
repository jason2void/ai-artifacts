const grid=document.getElementById('grid');
let cur='all', kw='';

const KEY='wedding-pins-20260919';
let pins=[];
try{ pins=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ pins=[]; }
const savePins=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(pins)); }catch(e){} };

function esc(x){return String(x).replace(/"/g,'&quot;');}

function cardHTML(p){
  const on=pins.includes(p.n);
  return '<div class="card'+(on?' pinned':'')+'">'+
    '<button class="pin" data-n="'+esc(p.n)+'" title="'+(on?'取消釘選':'釘選到最上方')+'" '+
      'aria-pressed="'+on+'">'+(on?'\u{1F4CC}':'\u{1F4CD}')+'</button>'+
    '<h2>'+p.n+' <span class="role">'+p.r+'</span></h2>'+
    (p.tag?'<span class="tagline">'+p.tag+'</span>':'')+
    '<ul class="tl">'+p.x.map(i=>
      '<li><span class="t">'+i[1]+'</span><span class="d">'+
      (i[0]==='9/19'?'':'<span class="day">'+i[0]+'</span>')+i[2]+'</span></li>'
    ).join('')+'</ul></div>';
}
function tbl(head,rows){
  return '<div class="scroller"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+
    '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
    '</tbody></table></div>';
}

function render(){
  let html='';
  // 釘選區：不論切到哪個分頁、搜尋什麼都固定顯示在最上方
  const pinned=pins.map(n=>P.find(p=>p.n===n)).filter(Boolean);
  if(pinned.length){
    html+='<h3 class="sec">\u{1F4CC} 我的釘選</h3>'+pinned.map(cardHTML).join('');
  }

  if(cur==='timeline'&&!kw){
    html+='<h3 class="sec">全場總時間軸</h3>'+tbl(['日期','時間','階段','內容／任務','負責人'],
      TL.map(r=>[r[0],'<span class="t">'+r[1]+'</span>',r[2],r[3],r[4]]));
    grid.innerHTML=html; return;
  }
  if(cur==='items'&&!kw){
    html+='<h3 class="sec">車輛安排</h3>'+tbl(['車輛','停車／位置','駕駛','搭乘人員','備註'],CARS)+
          '<h3 class="sec">物品 Check List</h3>'+tbl(['類別','物品','時間／地點','負責人'],ITEMS);
    grid.innerHTML=html; return;
  }

  const list=P.filter(p=>{
    if(pins.includes(p.n)) return false;           // 已在釘選區，不重複
    const gok = (cur==='all'||cur==='timeline'||cur==='items') ? true : p.g.includes(cur);
    if(!gok) return false;
    if(!kw) return true;
    return (p.n+p.r+p.x.map(i=>i.join('')).join('')).toLowerCase().includes(kw);
  });

  if(!list.length){
    html+= pinned.length ? '' : '<p class="empty">找不到符合的人員或任務</p>';
  }else{
    if(pinned.length) html+='<h3 class="sec">其他</h3>';
    html+=list.map(cardHTML).join('');
  }
  grid.innerHTML=html;
}

grid.addEventListener('click',e=>{
  const b=e.target.closest('.pin'); if(!b) return;
  const n=b.dataset.n;
  const i=pins.indexOf(n);
  if(i>-1) pins.splice(i,1); else pins.unshift(n);
  savePins(); render();
  if(i<0) window.scrollTo({top:0,behavior:'smooth'});
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');cur=b.dataset.g;render();
});
document.getElementById('q').oninput=e=>{kw=e.target.value.trim().toLowerCase();render();};
render();
</script>
